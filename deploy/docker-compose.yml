services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: autochecker-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/bot.db
      # Inside the container the private key is mounted at /app/ssh_key.
      # deploy/.env SSH_KEY_PATH remains the host path used by the volume mount.
      - SSH_KEY_PATH=/app/ssh_key
    volumes:
      - bot-data:/app/data
      - autochecker-results:/app/results
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/autochecker-sandbox:/tmp/autochecker-sandbox
      - ${SSH_KEY_PATH:?'SSH_KEY_PATH is required'}:/app/ssh_key:ro
    command: python3 main_bot.py

  sandbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sandbox
    image: autochecker-sandbox
    profiles: ["build-only"]

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: autochecker-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/bot.db
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
    volumes:
      - bot-data:/app/data
    ports:
      - "127.0.0.1:8082:8000"
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8000

volumes:
  bot-data:
  autochecker-results:
